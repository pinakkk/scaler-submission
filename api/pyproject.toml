[project]
name = "zoom-clone-api"
version = "0.1.0"
description = "FastAPI backend for the Zoom clone: REST API, WebSocket signaling, SQLite."
readme = "README.md"
requires-python = ">=3.12"

# Versions below are the ones actually installed and verified on Python 3.14.0.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlmodel==0.0.39",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "slowapi==0.1.10",
    # App-issued session JWTs (§8).
    "PyJWT==2.10.1",
    # Google ID-token verification against Google's JWKS (§8). Pulls `requests`,
    # which its transport layer requires.
    "google-auth==2.41.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
target-version = "py312"
line-length = 90
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()-in-defaults is the documented idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# conftest sets os.environ before importing app modules; the late imports are deliberate.
"tests/conftest.py" = ["E402"]
